name: Build Android APK (camscanner_clone)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camscanner_clone
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android/ platform folder (without touching lib/ or pubspec.yaml)
        run: |
          flutter create --platforms=android --org com.example --project-name camscanner_clone /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Add CAMERA permission to AndroidManifest.xml
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: Silence R8 for ML Kit script recognizers we don't use
        run: |
          cat >> android/app/proguard-rules.pro <<'EOF'
          # google_mlkit_text_recognition's generic initializer references the
          # per-script recognizer option classes for every script, but only the
          # one(s) actually depended on are bundled. This app only uses
          # TextRecognitionScript.latin, so tell R8 the rest are fine to be missing.
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          EOF
          cat android/app/proguard-rules.pro

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: camscanner-clone-apk
          path: camscanner_clone/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
